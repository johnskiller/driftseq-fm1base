# DriftSeq's build settings (platform/tools/build.py reads this file).
#
# IDENTITY — read this before changing id_prefix. The package identity is
# `id_prefix + "00"` (build.py main), so "FM-1_92" yields FM-1_9200. DriftSeq's
# old FELUCCA_ID was "FM-1_91001": six characters after the underscore, which no
# id_prefix can produce. That string is therefore NOT preserved by this port —
# and cannot be, the format does not allow it. Accepting a new identity is safe
# (the loader compares product id to firmware_id and refuses on mismatch, so a
# wrong one means a refused flash, not a brick); keeping a stale one is what
# bricks. FM-1_92 is DriftSeq's own range, clear of fm1-base's 11 and of
# fm1-ctrl's 91/92 pair — check that before shipping.
name = "driftseq"
id_prefix = "FM-1_92"
usb_manufacturer = "DriftSeq"
usb_product = "DriftSeq FM-1"
usb_pid = 0x9201               # own PID: macOS caches CoreMIDI port names by vid/pid/serial and the
                               # family shares vid 0x1209 pid 0x0001 with no serial — driftseq inherited
                               # fm1-ctrl's cached "FM-1 ctrl" endpoint (John 2026-10-28). Loader keeps 0x0002.
o2 = ["eas/eas_config_unit.c", "eas/eas_wtlib_unit.c", "eas/eas_unity.c"]
                               # the Sonivox GM synth: config and the sound library apart (their
                               # extern-vs-definition types only link across units), the rest one
                               # unit; all at -O2 (EAS's float math)
o2_cflags = ["-Ieas", "-Ieas_inc", "-Ieas/cutils"]  # eas.h, the strcmp shim, the Android log fakes
o2_include = ["eas_inc/string.h"]  # strcmp for eas_sndlibmgt.c (the toolchain has no libc header)
include = ["eas", "eas_inc"]   # app.c includes eas.h; eas_inc also answers <string.h> for the app's own unit
# The Sonivox EAS tree and its wavetable are third-party Apache-2.0 code that
# must not be edited, so they are excluded from the app's own checks: its
# 212 KB sample table reads as literal addresses to mmio_check (0x00011c7c and
# the like are waveform data, not registers).
vendored = ["eas/", "eas_inc/"]
words = "words.tsv"
font_full = ["M"]              # FONT_M carries lower case: chord names are written
                               # Cm / Cmaj7 / Csus4, not CM / CMAJ7 (+33 KB flash;
                               # the app slot has ~74 KB spare, so this fits)
ble = true                     # Bluetooth MIDI: the reason for this port
ble_central = true             # and the FM-1 may connect to BLE MIDI devices
# DriftSeq is a MIDI sequencer: it sends messages and makes no sound of its
# own, so the USB audio class is dead weight. Those two buffers are {abuf,
# st_buf} = 8 KB of the 96 KB of RAM, and RAM is what this port is short of
# once the BLE stack takes 76 KB of it. Turning both off keeps the app a plain
# USB-MIDI device, which is exactly what it wants to be.
usb_audio_in = false
usb_audio_out = false
tagline = "a polymetric sequencer for the FM-1"
repo = "https://github.com/johnskiller/driftseq"
# LICENCE. MPL-2.0 is the reason this project exists: per-file copyleft (§3.3)
# lets the built Larger Work — which links JieLi's Apache-2.0 *binary* Bluetooth
# libraries, source unavailable — be distributed. GPL-3.0 could not. See
# LICENSING.md.
licence = "MPL-2.0"
credits = "Built on fm1-base (MPL-2.0) and felucca-bsp."
